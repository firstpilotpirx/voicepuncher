[package]
name = "voicepuncher-e2e-test"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["lib"]

[[test]]
name = "cucumber_e2e"
harness = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"
hound = "3.5"
voicepuncher = { path = "../app" }

[dev-dependencies]
voicepuncher-command-spotting = { path = "../command-spotting" }
cucumber = "=0.23.0"
futures = "=0.3.34"
regex = "1"

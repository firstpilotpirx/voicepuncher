[package]
name = "voicepuncher-e2e-test"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lints]
workspace = true

[lib]
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "tcc-probe"
path = "src/bin/tcc_probe.rs"

[[test]]
name = "cucumber_e2e"
harness = false

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
anyhow = "=1.0.103"
tempfile = "=3.27.0"
hound = "=3.5.1"
voicepuncher = { path = "../app" }
cucumber = "=0.23.0"
regex = "=1.12.3"
voicepuncher-test-steps = { path = "../test-steps" }

[dev-dependencies]
env_logger = "=0.11.10"
log = "=0.4.29"
voicepuncher-command-spotting = { path = "../command-spotting" }
voicepuncher-copy-pool = { path = "../copy-pool" }
futures = "=0.3.34"
ureq = { version = "=2.12.1", default-features = false }
tungstenite = "=0.30.0"

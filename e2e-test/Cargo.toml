[package]
name = "voicepuncher-e2e-test"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"
crate-type = ["lib"]

[[test]]
name = "smoke"
path = "tests/e2e/smoke.rs"

[[test]]
name = "pipeline_accuracy"
path = "tests/e2e/pipeline_accuracy.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"
hound = "3.5"
owo-colors = { version = "4", features = ["supports-colors"] }

# Dependency policy of `just lint` (cargo-deny): advisories, licenses, duplicate versions, sources.
# The advisory database is fetched on the developer machine; the app itself stays offline.

[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
# Every license the dependency tree uses today; a new one fails until it is reviewed and added here
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BlueOak-1.0.0",
    # libbz2-rs-sys: build-only, via zip 9, the archive extractor of sherpa-onnx-sys
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

# The workspace's own crates are not published (publish = false)
[licenses.private]
ignore = true

[bans]
# Duplicate versions come from upstream crates: reported, not gated
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Permissions states</title>
<style>body{margin:0;padding:16px;background:#f5f5f7;font:13px -apple-system,system-ui,sans-serif}
main{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}figure{margin:0}figcaption{font-weight:600;margin-bottom:4px}
.pair{display:flex;gap:6px}iframe{width:520px;height:450px;border:0;zoom:.5}</style></head>
<body><main><figure><figcaption>01 none — all three Not asked yet</figcaption><div class="pair"><iframe src="permissions.html?state=none&bg=light"></iframe><iframe src="permissions.html?state=none&bg=dark"></iframe></div></figure><figure><figcaption>02 mixed — Microphone granted, Accessibility not granted, Input Monitoring not asked yet</figcaption><div class="pair"><iframe src="permissions.html?state=mixed&bg=light"></iframe><iframe src="permissions.html?state=mixed&bg=dark"></iframe></div></figure><figure><figcaption>03 checking — Input Monitoring Checking… after Request…</figcaption><div class="pair"><iframe src="permissions.html?state=checking&bg=light"></iframe><iframe src="permissions.html?state=checking&bg=dark"></iframe></div></figure><figure><figcaption>04 all-granted — all granted, Continue enabled</figcaption><div class="pair"><iframe src="permissions.html?state=all-granted&bg=light"></iframe><iframe src="permissions.html?state=all-granted&bg=dark"></iframe></div></figure><figure><figcaption>05 developer — unbundled: the warning line names iTerm2</figcaption><div class="pair"><iframe src="permissions.html?state=developer&bg=light"></iframe><iframe src="permissions.html?state=developer&bg=dark"></iframe></div></figure><figure><figcaption>06 revoked — reopened after Accessibility was revoked</figcaption><div class="pair"><iframe src="permissions.html?state=revoked&bg=light"></iframe><iframe src="permissions.html?state=revoked&bg=dark"></iframe></div></figure></main></body></html>

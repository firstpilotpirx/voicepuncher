<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permissions window</title>
<!--
  Mockup of the Permissions window (design-spec.md). Query parameters:
    ?state=none|mixed|checking|all-granted|developer|revoked   (default none)
    ?bg=light|dark                                              (default light)
  Screenshots: headless Chrome at 2x, 520x450 CSS px (the 460x390 pt window plus a margin).
-->
<style>
  :root {
    --desk: #c9ced6; --window: #ececec; --titlebar: #e3e3e3; --border: rgba(0,0,0,.18);
    --label: rgba(0,0,0,.85); --secondary: rgba(0,0,0,.5); --tile: rgba(0,122,255,.12);
    --blue: #007aff; --green: #28a745; --red: #ff3b30; --grey: #8e8e93; --warning: #c77700;
    --button: #ffffff; --button-border: rgba(0,0,0,.15); --separator: rgba(0,0,0,.1);
    --disabled: rgba(0,0,0,.25);
  }
  :root[data-theme="dark"] {
    --desk: #1b1d22; --window: #2a2a2c; --titlebar: #333336; --border: rgba(255,255,255,.14);
    --label: rgba(255,255,255,.88); --secondary: rgba(255,255,255,.55); --tile: rgba(10,132,255,.22);
    --blue: #0a84ff; --green: #32d74b; --red: #ff453a; --grey: #98989d; --warning: #ffb340;
    --button: #59595d; --button-border: rgba(255,255,255,.08); --separator: rgba(255,255,255,.1);
    --disabled: rgba(255,255,255,.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: var(--desk); font: 13px -apple-system, "SF Pro Text", system-ui, sans-serif;
    color: var(--label); -webkit-font-smoothing: antialiased;
  }
  .window {
    width: 460px; height: 390px; background: var(--window); border-radius: 12px;
    border: .5px solid var(--border); box-shadow: 0 18px 50px rgba(0,0,0,.35);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .titlebar {
    height: 28px; background: var(--titlebar); display: flex; align-items: center;
    border-bottom: .5px solid var(--separator); position: relative;
  }
  .lights { display: flex; gap: 8px; padding-left: 12px; }
  .lights span { width: 12px; height: 12px; border-radius: 50%; }
  .lights span:nth-child(1) { background: #ff5f57; }
  .lights span:nth-child(2) { background: #febc2e; }
  .lights span:nth-child(3) { background: var(--disabled); }
  .title { position: absolute; left: 0; right: 0; text-align: center; font-weight: 600; pointer-events: none; }
  .body { flex: 1; padding: 14px 20px 0; display: flex; flex-direction: column; }
  h1 { font-size: 15px; font-weight: 700; margin: 0 0 3px; }
  .sub { color: var(--secondary); margin: 0; line-height: 1.3; }
  .note { margin: 6px 0 0; font-weight: 500; line-height: 1.3; }
  .note.warning { color: var(--warning); }
  .note.revoked { color: var(--red); }
  .rows { margin-top: 12px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; align-items: center; gap: 10px; min-height: 40px; }
  .tile {
    width: 36px; height: 36px; border-radius: 8px; background: var(--tile); color: var(--blue);
    display: flex; align-items: center; justify-content: center; flex: none;
  }
  .tile svg { width: 22px; height: 22px; }
  .text { flex: 1; min-width: 0; }
  .name { font-weight: 500; }
  .why { font-size: 12px; color: var(--secondary); line-height: 1.25; }
  .status { width: 140px; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
  .badge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--secondary); }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.granted { background: var(--green); } .dot.denied { background: var(--red); } .dot.unasked { background: var(--grey); }
  .spinner {
    width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--grey);
    border-top-color: transparent;
  }
  button {
    font: inherit; font-size: 12px; height: 22px; border-radius: 6px; padding: 0 8px;
    background: var(--button); color: var(--label); border: .5px solid var(--button-border);
    box-shadow: 0 .5px 1px rgba(0,0,0,.15);
  }
  .status button { width: 140px; white-space: nowrap; }
  .footer {
    margin-top: auto; height: 52px; border-top: .5px solid var(--separator); padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .footer button { font-size: 13px; height: 24px; min-width: 80px; }
  button.default { background: var(--blue); color: #fff; border-color: transparent; }
  button:disabled { color: var(--disabled); background: var(--button); }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><div class="lights"><span></span><span></span><span></span></div><div class="title">Permissions</div></div>
  <div class="body">
    <h1>voicepuncher needs three permissions</h1>
    <p class="sub">Grant each one below. voicepuncher checks again by itself; no restart is needed.</p>
    <p class="note" id="note" hidden></p>
    <div class="rows" id="rows"></div>
  </div>
  <div class="footer"><button>Quit</button><button class="default" id="continue">Continue</button></div>
</div>
<script>
  const SYMBOLS = {
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>',
    accessibility: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><circle cx="12" cy="7.3" r="1.3" fill="currentColor"/><path d="M7.5 10h9M12 10v4.5l-2.5 3.5M12 14.5l2.5 3.5"/></svg>',
    keyboard: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M8 14.5h8"/></svg>',
  };
  const PERMISSIONS = [
    ['Microphone', 'to hear your dictation', 'mic'],
    ['Accessibility', 'to paste the text into the app you are typing in', 'accessibility'],
    ['Input Monitoring', 'to notice the hotkey in any app', 'keyboard'],
  ];
  // g granted, d not granted, u not asked yet, c checking
  const STATES = {
    'none': { rows: 'uuu' },
    'mixed': { rows: 'gdu' },
    'checking': { rows: 'gdc' },
    'all-granted': { rows: 'ggg' },
    'developer': { rows: 'gdu', note: ['warning', 'voicepuncher runs from iTerm2 — grant the permissions to iTerm2.'] },
    'revoked': { rows: 'gdg', note: ['revoked', 'Accessibility was revoked — dictation stopped'] },
  };
  const params = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = params.get('bg') === 'dark' ? 'dark' : 'light';
  const state = STATES[params.get('state')] || STATES.none;
  const badge = { g: ['granted', 'Granted'], d: ['denied', 'Not granted'], u: ['unasked', 'Not asked yet'] };
  const button = { d: 'Open System Settings', u: 'Request…' };
  document.getElementById('rows').innerHTML = PERMISSIONS.map(([name, why, symbol], i) => {
    const s = state.rows[i];
    const shown = s === 'c'
      ? '<span class="spinner"></span>Checking…'
      : `<span class="dot ${badge[s][0]}"></span>${badge[s][1]}`;
    return `<div class="row"><div class="tile">${SYMBOLS[symbol]}</div>
      <div class="text"><div class="name">${name}</div><div class="why">${why}</div></div>
      <div class="status"><div class="badge">${shown}</div>${button[s] ? `<button>${button[s]}</button>` : ''}</div></div>`;
  }).join('');
  if (state.note) {
    const note = document.getElementById('note');
    note.hidden = false;
    note.className = `note ${state.note[0]}`;
    note.textContent = state.note[1];
  }
  document.getElementById('continue').disabled = state.rows !== 'ggg';
</script>
</body>
</html>

schema: spec-driven

context: |
  voicepuncher: push-to-talk voice-to-text CLI for macOS on Apple Silicon only (Metal, CoreAudio, TCC permissions: Microphone, Accessibility, Input Monitoring).
  Product stage: PoC.
  Privacy: audio and text never leave the machine; no internet access at runtime.
  One Rust crate app/ with hexagonal architecture: adapters -> core/application -> core/domain. Ports are traits in app/src/core/application/. No framework imports in app/src/core/. Adapters live in app/src/adapters/{primary,secondary}/<feature>/<tech>/.
  Domain terms come from docs/ubiquitous-language.md; a change that introduces a term adds it there.
  Verification: `just test` (~1 min) after every edit, `just check` (~4 min) after every task group, `just full-check` (~30 min) before merging; manual run by the user for hotkey, recording, overlay, paste and permissions (CLAUDE.md § How to verify a change).
  Write all artifacts in English.

rules:
  proposal:
    - State current stage, target stage, scope and acceptance bar.
    - List what is out of scope.
  specs:
    - Scenarios state business intent; never name a type, endpoint, JSON field, config key or env var in WHEN/THEN.
  tasks:
    - End each task group with `just check`; end the list with `just full-check` and the manual checks the user performs.

operations:
  apply:
    guidance:
      - Run `just test` after every edit and `just check` after every task group; fix failures before the next task.
      - Run `just full-check` before reporting the change as done or opening the PR for merge.
  archive:
    guidance:
      - Archive only after `just full-check` passed on the final commit.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

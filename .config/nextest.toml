# Manual: the @real_keyboard scenarios of the slice/component harness, not measured: default 2 min
[profile.real-keyboard]
success-output = "immediate"

[[profile.real-keyboard.overrides]]
filter = 'binary(cucumber_integration)'
run-extra-args = ["--tags", "@real_keyboard"]

# chunked_transcription_it, 112 s measured: 4 min; @seams with the voice start timing, 252 s measured: 9 min
[profile.e2e-seams]
success-output = "immediate"

[[profile.e2e-seams.overrides]]
filter = 'binary(chunked_transcription_it)'

# cargo-nextest configuration: the time limit of every Rust test (fail-hung-tests-fast).
# A test is reported SLOW after each period and stopped (TIMEOUT, SIGTERM to its process group, SIGKILL
# after nextest's 10 s grace period) after `terminate-after` periods. A limit is the smallest whole number
# of minutes that is at least twice the longest run of the current code, never below the 2 min default; a
# suite that grows past half its limit gets a new limit, twice its new longest run, in the same change.
# Never raise a limit to let a hang pass.

# The version the justfile's _require-nextest guard checks; an older nextest refuses to run
nextest-version = { required = "0.9.146" }

[profile.default]
# SLOW at 30 s, stopped at 2 min (+10 s grace)
slow-timeout = { period = "30s", terminate-after = 4 }
# Every failure reported, as the former bash loop of _test did
fail-fast = false
# The run ends listing the failed, timed-out and slow tests
final-status-level = "slow"

[test-groups]
# The tests that drive the shared command spotting service run one at a time: the shared services
# must not see more load than before
command-spotting-models = { max-threads = 1 }
# The tests that load the command spotting models in their own process: ONNX Runtime aborts when
# models load or run on several threads of one process, and nextest runs each test in a process of
# its own, so several run at once (6: 49–53 s for `just test` over three runs, against 52–74 s with 4
# and 93 s with 2)
command-spotting-engine = { max-threads = 6 }
# The tests that write the real general pasteboard run one at a time: they share that one pasteboard. Runs
# of other checkouts are kept apart by the pasteboard file lock the tests take (app/tests/support)
pasteboard = { max-threads = 1 }

[[profile.default.overrides]]
filter = '(package(voicepuncher-command-spotting) & binary(it) & (test(/^engine::/) | test(/^placed_commands::/)))'
test-group = "command-spotting-engine"
# Started first (speed-up-smoke-and-test): the group's 6 threads hold about 85 s of model work, which bounds
# `just test` when it starts after the quick tests
priority = 50

# The longest single tests start right after the model tests, so none of them starts last
[[profile.default.overrides]]
filter = 'test(should_log_a_copy_hung_with_the_time_waited_only_past_twice_its_time_limit) | (package(voicepuncher) & binary(it) & (test(/^commandspotting_reconnect::/) | test(/^commandspotting_client::/))) | (package(voicepuncher-command-spotting) & binary(it) & (test(/^server::/)))'
priority = 40

[[profile.default.overrides]]
filter = '(package(voicepuncher) & binary(it) & (test(/^textpasting_macos::/)))'
test-group = "pasteboard"

# The minute of dictation fed in real time beside CPU hogs: its 10 ms paces overshoot under load (73–84 s
# measured inside `just test`): 3 min
[[profile.default.overrides]]
filter = 'test(=recording_cpal::synthetic::should_keep_every_sample_of_a_long_dictation_in_order_on_a_busy_machine)'
slow-timeout = { period = "60s", terminate-after = 3 }

# The tests that drive the real command spotting service run one at a time too, so one confirmation
# service never gets the utterances of several test processes at once
[[profile.default.overrides]]
filter = '(package(voicepuncher) & binary(it) & (test(/^commandspotting_websocket::/) | test(/^voice_forms::/) | test(/^voice_samples::/)))'
test-group = "command-spotting-models"

# ── Suite profiles ── one per E2E recipe (`cargo nextest run --profile <recipe>`): its scenario selection
# next to its limits, so a suite never runs under another suite's limit. Each inherits the default profile
# and its overrides (the model test groups). A Gherkin harness run is one test, `scenarios`
# (e2e-test/src/harness_args.rs), whose `run-extra-args` are cucumber's command line. The service binaries
# stay captured; their output is printed whole per test, as `-- --nocapture` showed it

# The smoke set, one profile per capability (the justfile's e2e_smoke_stages): the four selections make up the
# @smoke scenarios. Each part runs its service binaries and its harness in one nextest call, side by side, the
# harness captured like the binaries (_e2e-smoke-part). Service binaries: default 2 min a test (voice_forms 34 s measured)

# @smoke of speech recognition, file transcription and every capability without a part of its own (the dictation archive),
# its recording files transcribed one at a time (@serial), 36 s measured, 57 s beside a light-class run: 2 min
[profile.e2e-smoke-speech]
success-output = "immediate"

[[profile.e2e-smoke-speech.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@smoke and not @text_refinement and not @voice_control and not @local_services and not @wip"]
slow-timeout = { period = "60s", terminate-after = 2 }

# @smoke of text refinement, 11 s measured: 2 min
[profile.e2e-smoke-refinement]
success-output = "immediate"

[[profile.e2e-smoke-refinement.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@smoke and @text_refinement and not @wip"]
slow-timeout = { period = "60s", terminate-after = 2 }

# @smoke of voice control, 136 s measured: 5 min
[profile.e2e-smoke-voice]
success-output = "immediate"

[[profile.e2e-smoke-voice.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@smoke and @voice_control and not @wip"]
slow-timeout = { period = "60s", terminate-after = 5 }

# @smoke of local services, 119 s measured (with the two shared-copies scenarios under load): 4 min
[profile.e2e-smoke-services]
success-output = "immediate"

[[profile.e2e-smoke-services.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@smoke and @local_services and not @wip"]
slow-timeout = { period = "60s", terminate-after = 4 }

# @regression, the voice control scenarios beyond the smoke set, 23 s measured: default 2 min
[profile.e2e-regression]
success-output = "immediate"

[[profile.e2e-regression.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@regression and not @wip"]

# @accuracy on 10 recordings, 62 s measured: 3 min
[profile.e2e-quick]
success-output = "immediate"

[[profile.e2e-quick.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@accuracy and not @wip"]
slow-timeout = { period = "60s", terminate-after = 3 }

# @refinement, 27 s measured (the evaluation set sent once): default 2 min
[profile.refine-eval]
success-output = "immediate"

[[profile.refine-eval.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@refinement and not @wip"]

# @accuracy on 100 recordings and the 20 recordings of "Ordinary speech triggers no command": 292 s the longest
# pass of the stage journal (2026-10-22, fix/voice-commands-under-load), past half the old 6 min: 10 min
[profile.e2e-bench]
success-output = "immediate"

[[profile.e2e-bench.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@accuracy and not @wip"]
slow-timeout = { period = "60s", terminate-after = 10 }

# @resilience, 200 s measured: 7 min
[profile.e2e-resilience]
success-output = "immediate"

[[profile.e2e-resilience.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@resilience and not @wip"]
slow-timeout = { period = "60s", terminate-after = 7 }

# chunked_transcription, 120 s measured: 4 min; @seams, 88 s measured (the voice start timing moved to e2e-cues): 3 min
[profile.e2e-seams]
success-output = "immediate"

[[profile.e2e-seams.overrides]]
filter = '(package(voicepuncher) & binary(it) & (test(/^chunked_transcription::/)))'
slow-timeout = { period = "60s", terminate-after = 4 }

[[profile.e2e-seams.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@seams and not @wip"]
slow-timeout = { period = "60s", terminate-after = 3 }

# @cues, the voice start timing on an idle machine, 135 s measured: 5 min
[profile.e2e-cues]
success-output = "immediate"

[[profile.e2e-cues.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@cues and not @wip"]
slow-timeout = { period = "60s", terminate-after = 5 }

# @bundle, the app-distribution scenarios of full-check's bundle stage, 26 s measured: default 2 min
[profile.bundle]
success-output = "immediate"

[[profile.bundle.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@bundle and not @wip and not @bundle_engines"]

# @bundle_engines, the e2e-bundle stage: the bundle copy's services started from its engines, 17 s measured: 2 min
[profile.e2e-bundle]
success-output = "immediate"

[[profile.e2e-bundle.overrides]]
filter = 'binary(cucumber_e2e)'
run-extra-args = ["--tags", "@bundle_engines and not @wip"]
slow-timeout = { period = "60s", terminate-after = 2 }

# Manual: the @real_keyboard scenarios of the slice/component harness, not measured: default 2 min
[profile.real-keyboard]
success-output = "immediate"

[[profile.real-keyboard.overrides]]
filter = 'binary(cucumber_integration)'
run-extra-args = ["--tags", "@real_keyboard"]

# The hosted CI (.github/workflows/ci.yml, NEXTEST_PROFILE=ci), which has no logged-in desktop and other `say`
# voices than the owner's Mac: leaves out the overlay drawing test, which needs a running window server, and the
# check that the synthesized speech is over 30 s, which holds only for the owner's voices. Inherits every limit
# and override of the default profile; the default filter narrows any filter given on the command line
[profile.ci]
default-filter = 'not ((binary(main_thread) & test(/^visualfeedback_macos::/)) | test(=speech::tests::should_synthesize_speech_longer_than_the_chunk_threshold_in_every_condition))'

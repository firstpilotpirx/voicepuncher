# The frozen tests: tests that failed in a check outside the change that ran it (a flake under load), which no
# recipe runs until a fix removes their entry (AGENTS.md § How to verify a change). `just freeze-test` adds an
# entry here and on main at once; `just frozen-tests` lists them, `just frozen-tests run` runs only them.
#
# [[frozen]]
# test = "scenario: <name>"              # or "<package>::<binary> <test>", the stage journal's form
# frozen = "2026-10-23"                  # the day it was frozen
# recipe = "full-check"                  # the recipe it failed in
# stage = "e2e-smoke-voice"              # the stage it failed in, where `frozen-tests run` runs it
# beside = "<what ran beside it>"        # other sessions' runs, the [machine-lock] holder
# branch = "<the branch whose check failed>"


[[frozen]]
test = "voicepuncher::it docs_check::should_pass_when_every_named_thing_exists"
frozen = "2026-10-27"
recipe = "full-check"
stage = "test"
beside = "the whole test stage under load (1539 tests); 16 s alone, 120 s limit"
branch = "feat/reduce-voice-start-latency"


# ~/.voicepuncher/config.toml
[hotkey]
key = "RightOption"          # one of HotKey enum variants
min_press_ms = 200

[audio]
input_device = "default"

[transcription]
# Local speech recognition service (OpenAI Audio Transcriptions API). Start it with
# `just start-model-servers`; the model and decoder flags are set when starting the service.
base_url = "http://127.0.0.1:8081/v1"   # must be on this machine: localhost, 127.0.0.0/8 or [::1]
model = "whisper-1"                     # sent as-is; whisper-server ignores it
language = "auto"                       # "ru", "en", … or "auto" to let the service detect it
prompt = "Docker, Kubernetes, GitHub, CI/CD, API, WEB3, WEB3 node, service, controller, terminal, pnpm, qa:fix, fix, staging, prod, test, E2E, integration, Jira, Slack, PR."
temperature = 0.0
timeout_secs = 60          # per request
chunk_threshold_secs = 15  # recordings longer than this (seconds) are transcribed in chunks; 0 = always single-pass
chunk_overlap_secs = 2     # seconds of audio repeated at the start of each subsequent chunk (boundary guard)
vad_lookback_secs = 5      # max seconds to look back from hard chunk boundary when searching for a pause to cut in

[paste]
clipboard_restore_delay_ms = 120
focus_wait_seconds = 300   # wait this long for a text input to get focus before pasting; 0 = paste at once

[sounds]
start_sound = "Glass"   # macOS system sound name, or "" to disable
stop_sound = "Pop"      # macOS system sound name, or "" to disable
cancel_sound = "Basso"  # played when recording is cancelled with Escape
listening_on_sound = "Tink"     # voice control: the hotkey turned listening on
listening_off_sound = "Bottle"  # voice control: the hotkey turned listening off
enter_sound = "Morse"           # voice control: "press enter" was carried out
clear_sound = "Purr"            # voice control: "clear all text" was carried out
paste_sound = "Frog"            # voice control: "paste text" was carried out
restart_sound = "Hero"          # voice control: "restart dictation" started the dictation over

[voice_control]
# Hands-free mode (also `--voice-control`): listening starts with the app, the hotkey turns it off
# and on again, and spoken
# English commands, each said on its own with a pause before and after, take effect:
# "start dictation", "stop dictation", "cancel dictation", "press enter", "clear all text".
# Needs the command spotting service: `just models`, then `just start-model-servers`.
enabled = false
url = "ws://127.0.0.1:8082"   # must be on this machine: localhost, 127.0.0.0/8 or [::1]

[archive]
# The dictation archive: every dictation that reached speech recognition is kept in its own
# folder (audio.wav + entry.json); the oldest are deleted once the folder outgrows the limit.
# `--no-archive` turns it off for one run, `--archive-dir <DIR>` names another folder.
enabled = true
dir = "~/.voicepuncher/history"
max_size_mb = 2048

[logging]
level = "info"

[services]
# In hotkey mode the app starts the local services it needs and stops them at quit; a service
# that already answers (started by `just start-model-servers`) is used and left running.
# false: the app starts nothing and expects the services from `just start-model-servers`.
manage = true
dictation_copies = 3   # whisper-server copies of the speech recognition service for dictation, 1 to 4
command_copies = 3     # the same for the speech recognition service for commands
models_dir = "~/.voicepuncher/models"
commands_url = "http://127.0.0.1:8085/v1"   # the speech recognition service for commands

[app]
# Kept by the app, not a setting: whether it already asked to start at login. Start at login
# itself is System Settings → General → Login Items (or the switch in Settings → General).
launch_at_login_asked = false

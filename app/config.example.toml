# ~/.voicepuncher/config.toml
[hotkey]
key = "RightOption"          # one of HotKey enum variants
min_press_ms = 200

[audio]
input_device = "default"
debug_save_wav = false

[transcription]
# Local speech recognition service (OpenAI Audio Transcriptions API). Start it with
# `just start-model-servers`; the model and decoder flags are set when starting the service.
base_url = "http://127.0.0.1:8081/v1"   # must be on this machine: localhost, 127.0.0.0/8 or [::1]
model = "whisper-1"                     # sent as-is; whisper-server ignores it
language = "auto"                       # "ru", "en", … or "auto" to let the service detect it
prompt = "Docker, Kubernetes, GitHub, CI/CD, API, WEB3, WEB3 node, service, controller, terminal, pnpm, qa:fix, fix, staging, prod, test, E2E, integration, Jira, Slack, PR."
temperature = 0.0
timeout_secs = 60          # per request
chunk_threshold_secs = 15  # recordings longer than this (seconds) are transcribed in chunks; 0 = always single-pass
chunk_overlap_secs = 2     # seconds of audio repeated at the start of each subsequent chunk (boundary guard)
vad_lookback_secs = 5      # max seconds to look back from hard chunk boundary when searching for a pause to cut in

[refinement]
# Local text refinement service (OpenAI Chat Completions API). Start it with
# `just start-model-servers`; the model and its context size are set when starting the service.
base_url = "http://127.0.0.1:8080/v1"   # must be on this machine: localhost, 127.0.0.0/8 or [::1]
model = "local"                         # llama-server serves one model and accepts any name
api_key = ""                            # sent as a bearer token when not empty (llama-server --api-key)
system_prompt = """\
You are a speech-to-text post-processor. Your ONLY job is to fix ASR recognition errors: \
wrong words, technical terms transcribed in the wrong alphabet, \
words accidentally merged or split. \
CRITICAL RULES — NEVER BREAK THESE: \
(1) NEVER shorten, cut, truncate, abbreviate, or summarize. \
NEVER use ellipsis (...). NEVER omit any word. \
Output the COMPLETE text — every single word, no exceptions. \
(2) Do NOT rewrite, rephrase, restructure, or improve style. Fix only broken words. \
(3) Preserve the original language exactly — do not translate between languages. \
If the input contains multiple languages or code-switching (e.g. Russian + English), \
preserve each language exactly as spoken. \
(4) Fix technical terms to their correct script \
(e.g. Docker, API, Kubernetes in English even inside Russian text). \
(5) If nothing needs fixing, copy the input verbatim — every word, every number. \
Reply with the corrected text only, nothing else."""
max_tokens = 512           # upper bound for the cleaned text; the budget also scales with the transcript
temperature = 0.0
timeout_secs = 30          # per request

[paste]
clipboard_restore_delay_ms = 120
focus_wait_seconds = 300   # wait this long for a text input to get focus before pasting; 0 = paste at once

[sounds]
start_sound = "Glass"   # macOS system sound name, or "" to disable
stop_sound = "Pop"      # macOS system sound name, or "" to disable
cancel_sound = "Basso"  # played when recording is cancelled with Escape

[logging]
level = "info"

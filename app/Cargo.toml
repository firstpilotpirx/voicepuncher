[package]
name = "voicepuncher"
version = "0.27.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"

cpal = "0.17"
hound = "3.5"
rubato = "0.16"

rdev = "0.5.3"

arboard = "3.6"

toml = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }

env_logger = "0.11"
dialoguer = "0.11"
console = "0.15"
ureq = { version = "2", features = ["tls"] }
url = "2"
serde_json = "1"
tungstenite = "=0.30.0"
voicepuncher-copy-pool = { path = "../copy-pool" }

core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSDate", "NSNotification", "NSProcessInfo", "NSRunLoop", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAccessibility",
    "NSApplication",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGlassEffectView",
    "NSGraphics",
    "NSImage",
    "NSImageView",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSProgressIndicator",
    "NSRunningApplication",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSAppearance",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
] }
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = ["CGColor", "CGPath"] }
objc2-quartz-core = { version = "0.3", features = [
    "CAAnimation",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CAShapeLayer",
    "CATransaction",
] }

[dev-dependencies]
libc = "=0.2.186"
mockall = "0.13"
tempfile = "3"
walkdir = "2"
regex = "1"
cucumber = "=0.23.0"
futures = "=0.3.34"
voicepuncher-e2e-test = { path = "../e2e-test" }

[[test]]
name = "cucumber_integration"
harness = false

[[test]]
name = "visualfeedback_macos_it"
harness = false

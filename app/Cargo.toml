[package]
name = "voicepuncher"
version = "0.38.3"
edition = "2021"
rust-version = "1.88"
publish = false

[lints]
workspace = true

# The size_budgets test measures every member's source, so its part key (justfile _stage-keys) covers them all
[package.metadata.stage-keys]
tests-read-every-member = true

[dependencies]
anyhow = "=1.0.103"
thiserror = "=1.0.69"
serde = { version = "=1.0.228", features = ["derive"] }
log = "=0.4.29"

cpal = "=0.17.3"
hound = "=3.5.1"
rubato = "=0.16.2"


arboard = "=3.6.1"

toml = "=0.8.23"
toml_edit = "=0.25.11"
dirs = "=5.0.1"
clap = { version = "=4.6.1", features = ["derive"] }

env_logger = "=0.11.10"
ureq = { version = "=2.12.1", features = ["tls"] }
sha2 = "=0.11.1"
url = "=2.5.8"
serde_json = "=1.0.149"
tungstenite = "=0.30.0"
signal-hook = "=0.4.5"
libc = "=0.2.186"
voicepuncher-copy-pool = { path = "../copy-pool" }

core-foundation = "=0.10.1"
core-graphics = "=0.25.0"
objc2 = "=0.6.4"
block2 = "=0.6.2"
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSBundle", "NSData", "NSDate", "NSDictionary", "NSIndexSet", "NSNotification", "NSProcessInfo", "NSRunLoop", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "=0.3.2", features = [
    "NSAccessibility",
    "NSActionCell",
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSBitmapImageRep",
    "NSButtonCell",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGlassEffectView",
    "NSGraphics",
    "NSGridView",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSPathControl",
    "NSPopUpButton",
    "NSProgressIndicator",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSScrollView",
    "NSSlider",
    "NSSound",
    "NSStackView",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStepper",
    "NSSwitch",
    "NSTableColumn",
    "NSTableHeaderView",
    "NSTableView",
    "NSTabViewController",
    "NSTabViewItem",
    "NSText",
    "NSTextField",
    "NSTextStorage",
    "NSTextView",
    "NSUserInterfaceItemIdentification",
    "NSUserInterfaceLayout",
    "NSView",
    "NSViewController",
    "NSVisualEffectView",
    "NSWindow",
    "NSWindowController",
    "NSWorkspace",
] }
objc2-core-foundation = "=0.3.2"
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-core-graphics = { version = "=0.3.2", features = ["CGColor", "CGPath"] }
objc2-quartz-core = { version = "=0.3.2", features = [
    "CAAnimation",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CAShapeLayer",
    "CATransaction",
] }
rtrb = "=0.4.0"

[dev-dependencies]
voicepuncher-test-steps = { path = "../test-steps" }
mockall = "=0.13.1"
tempfile = "=3.27.0"
walkdir = "=2.5.0"
regex = "=1.12.3"
syn = { version = "=2.0.117", features = ["full", "visit"] }
proc-macro2 = { version = "=1.0.106", features = ["span-locations"] }
cucumber = "=0.23.0"
futures = "=0.3.34"
voicepuncher-e2e-test = { path = "../e2e-test" }
assert_no_alloc = "=1.1.2"

[[test]]
name = "cucumber_integration"
harness = false

[[test]]
name = "main_thread"
harness = false

[package]
name = "voicepuncher"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"

cpal = "0.17"
hound = "3.5"
rubato = "0.16"
ringbuf = "0.4"

rdev = "0.5.3"

whisper-rs = { version = "0.16", features = ["metal"] }

llama-cpp-2 = { version = "0.1.146", features = ["metal"] }

arboard = "3.6"

toml = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }

env_logger = "0.11"
dialoguer = "0.11"
console = "0.15"
indicatif = "0.17"
ureq = { version = "2", features = ["tls"] }

core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSCell",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSProgressIndicator",
    "NSRunningApplication",
    "NSScreen",
    "NSText",
    "NSTextField",
    "NSView",
    "NSWindow",
] }
objc2-quartz-core = { version = "0.3", features = ["CALayer"] }

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
walkdir = "2"
regex = "1"

[package]
name = "voicepuncher"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"

cpal = "0.17"
hound = "3.5"
rubato = "0.16"
ringbuf = "0.4"

rdev = "0.5.3"

whisper-rs = { version = "0.16", features = ["metal"] }

llama-cpp-2 = { version = "0.1.146", features = ["metal"] }

arboard = "3.6"
enigo = "0.6"

toml = "0.8"
dirs = "5"
clap = { version = "4", features = ["derive"] }

env_logger = "0.11"
dialoguer = "0.11"
indicatif = "0.17"
ureq = { version = "2", features = ["tls"] }

core-foundation = "0.10"

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
walkdir = "2"
regex = "1"

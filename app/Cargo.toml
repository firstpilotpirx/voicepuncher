[package]
name = "voicepuncher"
version = "0.33.0"
edition = "2021"
rust-version = "1.88"

[dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"

cpal = "0.17"
hound = "3.5"
rubato = "0.16"

rdev = "0.5.3"

arboard = "3.6"

toml = "0.8"
toml_edit = "=0.25.11"
dirs = "5"
clap = { version = "4", features = ["derive"] }

env_logger = "0.11"
dialoguer = "0.11"
console = "0.15"
ureq = { version = "2", features = ["tls"] }
url = "2"
serde_json = "1"
tungstenite = "=0.30.0"
signal-hook = "=0.4.5"
libc = "=0.2.186"
voicepuncher-copy-pool = { path = "../copy-pool" }

core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
block2 = "=0.6.2"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSData", "NSDate", "NSDictionary", "NSIndexSet", "NSNotification", "NSProcessInfo", "NSRunLoop", "NSString", "NSURL", "NSValue"] }
objc2-app-kit = { version = "0.3", features = [
    "NSAccessibility",
    "NSActionCell",
    "NSAlert",
    "NSAppearance",
    "NSApplication",
    "NSAttributedString",
    "NSButton",
    "NSBitmapImageRep",
    "NSButtonCell",
    "NSCell",
    "NSClipView",
    "NSColor",
    "NSColorSpace",
    "NSControl",
    "NSEvent",
    "NSFont",
    "NSFontDescriptor",
    "NSGlassEffectView",
    "NSGraphics",
    "NSGridView",
    "NSImage",
    "NSImageRep",
    "NSImageView",
    "NSLayoutConstraint",
    "NSMenu",
    "NSMenuItem",
    "NSOpenPanel",
    "NSPanel",
    "NSPasteboard",
    "NSPasteboardItem",
    "NSPathControl",
    "NSPopUpButton",
    "NSProgressIndicator",
    "NSResponder",
    "NSRunningApplication",
    "NSSavePanel",
    "NSScreen",
    "NSScrollView",
    "NSSlider",
    "NSSound",
    "NSStackView",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSStepper",
    "NSSwitch",
    "NSTableColumn",
    "NSTableHeaderView",
    "NSTableView",
    "NSTabViewController",
    "NSTabViewItem",
    "NSText",
    "NSTextField",
    "NSTextStorage",
    "NSTextView",
    "NSUserInterfaceItemIdentification",
    "NSUserInterfaceLayout",
    "NSView",
    "NSViewController",
    "NSVisualEffectView",
    "NSWindow",
    "NSWindowController",
    "NSWorkspace",
] }
objc2-core-foundation = "0.3"
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-core-graphics = { version = "0.3", features = ["CGColor", "CGPath"] }
objc2-quartz-core = { version = "0.3", features = [
    "CAAnimation",
    "CALayer",
    "CAMediaTiming",
    "CAMediaTimingFunction",
    "CAShapeLayer",
    "CATransaction",
] }

[dev-dependencies]
mockall = "0.13"
tempfile = "3"
walkdir = "2"
regex = "1"
cucumber = "=0.23.0"
futures = "=0.3.34"
voicepuncher-e2e-test = { path = "../e2e-test" }

[[test]]
name = "cucumber_integration"
harness = false

[[test]]
name = "visualfeedback_macos_it"
harness = false

[[test]]
name = "menubar_macos_it"
harness = false

[[test]]
name = "settings_macos_it"
harness = false

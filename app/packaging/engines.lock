# This workspace's command spotting service (sherpa-onnx linked statically), from its release build
[command-spotting]
source = "workspace"
program = "voicepuncher-command-spotting"
package = "voicepuncher-command-spotting"

# The license of every bundled engine and library: <engine section or homebrew formula or cargo crate or
# repo>:<path>
[licenses]
"whisper.cpp-LICENSE" = "homebrew:whisper.cpp/LICENSE"
"ggml-LICENSE" = "homebrew:ggml/LICENSE"
"libomp-LICENSE" = "homebrew:libomp/LICENSE.TXT"
"sherpa-onnx-LICENSE" = "cargo:sherpa-onnx-sys/LICENSE"
"onnxruntime-LICENSE" = "repo:app/packaging/licenses/onnxruntime-LICENSE"

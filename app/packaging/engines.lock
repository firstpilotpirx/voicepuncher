# The engines the bundle carries: where each comes from, its version, and the sha256 of every file taken
# from that source (before relocation). `just engines` takes nothing else and builds no engine from source.
# Bump an engine: change its version here, run `just engines` (it names every file whose checksum differs),
# write the new checksums here with the reason in the commit, then run `just full-check` (README § Engines).

# whisper.cpp from Homebrew (whisper.cpp publishes no macOS server binary), with Homebrew's ggml, its
# run-time backends (libexec/*.so) and the OpenMP runtime ggml-base links; `from` is <formula>/<path in
# the formula's version folder of `brew --cellar`>
[whisper]
source = "homebrew"
program = "whisper-server"
version = "1.9.5"

[whisper.formulae]
"whisper.cpp" = "1.9.5"
ggml = "0.27.0"
libomp = "23.1.3"

[whisper.from]
"whisper-server" = "whisper.cpp/bin/whisper-server"
"libwhisper.1.dylib" = "whisper.cpp/lib/libwhisper.1.dylib"
"libggml.0.dylib" = "ggml/lib/libggml.0.dylib"
"libggml-base.0.dylib" = "ggml/lib/libggml-base.0.dylib"
"libggml-blas.so" = "ggml/libexec/libggml-blas.so"
"libggml-cpu-apple_m1.so" = "ggml/libexec/libggml-cpu-apple_m1.so"
"libggml-cpu-apple_m2_m3.so" = "ggml/libexec/libggml-cpu-apple_m2_m3.so"
"libggml-cpu-apple_m4.so" = "ggml/libexec/libggml-cpu-apple_m4.so"
"libggml-metal.so" = "ggml/libexec/libggml-metal.so"
"libomp.dylib" = "libomp/lib/libomp.dylib"

[whisper.sha256]
"whisper-server" = "9d3bf58513018556ed0131af5519b1a13153a16eea6115dfa094b320559d8020"

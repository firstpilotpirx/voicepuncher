[workspace]
members = ["analyzers", "app", "command-spotting", "copy-pool", "dev-tools", "e2e-test", "test-steps", "voice-commands"]
resolver = "2"

# Size and complexity budgets (AGENTS.md § Architecture rules; thresholds in clippy.toml). A unit over budget on
# `main` carries `#[expect(clippy::<lint>, reason = "size baseline")]` and an entry in app/tests/size_baseline.toml
[workspace.lints.clippy]
too_many_lines = "deny"
too_many_arguments = "deny"
excessive_nesting = "deny"
cognitive_complexity = "deny"
type_complexity = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Test builds: line tables are enough for a backtrace with file and line; full debug info only slows the links
[profile.dev]
debug = "line-tables-only"

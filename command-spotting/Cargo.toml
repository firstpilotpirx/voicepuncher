[package]
name = "voicepuncher-command-spotting"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Command spotting service of voicepuncher: spots the voice control phrases in streamed audio"

[dependencies]
anyhow = "=1.0.102"
clap = { version = "=4.6.1", features = ["derive"] }
env_logger = "=0.11.10"
hound = "=3.5.1"
log = "=0.4.29"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
sherpa-onnx = "=1.13.8"
tungstenite = "=0.30.0"
ureq = { version = "=2.12.1", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"
